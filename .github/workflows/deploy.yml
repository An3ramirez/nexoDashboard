name: Deploy dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-production
  cancel-in-progress: false

jobs:
  deploy:
    # Este runner debe estar instalado en el servidor privado 192.168.1.61.
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Validar y desplegar
        shell: bash
        env:
          DEPLOY_DIR: /home/andres/.openclaw/workspace/dashboard-server
          FILES_DIR: /home/andres/nexodashboard-files
        run: |
          set -euo pipefail
          node --check index.js
          node --check extras.js
          node --check storage.js
          node --check health.js
          node --check applications.js
          node --check application-services.js
          node --check public/applications.js
          node -e "require('node:sqlite')"
          npm ci --omit=dev
          npm test
          test -d "$DEPLOY_DIR"
          test -d "$FILES_DIR"

          # El código se actualiza, pero las credenciales, archivos subidos y
          # datos runtime permanecen fuera del checkout desplegado.
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='auth.json' \
            --exclude='data/' \
            --exclude='node_modules/' \
            ./ "$DEPLOY_DIR/"

          cd "$DEPLOY_DIR"
          npm ci --omit=dev

          sudo install -m 0644 "$GITHUB_WORKSPACE/deploy/nexodashboard.service" /etc/systemd/system/nexodashboard.service
          sudo systemctl daemon-reload
          sudo systemctl restart nexodashboard.service

          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null; then
              pid="$(systemctl show -p MainPID --value nexodashboard.service)"
              test "$pid" -gt 1
              test "$(pgrep -fc '^/usr/bin/node /home/andres/.openclaw/workspace/dashboard-server/index.js$')" -eq 1
              echo "Dashboard desplegado correctamente"
              exit 0
            fi
            sleep 1
          done
          echo "El dashboard no respondió en el puerto 3000"
          sudo journalctl -u nexodashboard.service -n 80 --no-pager || true
          exit 1
