<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f06f4b"/>
      <stop offset="100%" stop-color="#b23f22"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e85d3a" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#f5a524" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e85d3a" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- Monitor body -->
  <rect x="8" y="10" width="48" height="34" rx="5" fill="none" stroke="url(#g)" stroke-width="2.5"/>

  <!-- Screen inner glow -->
  <rect x="11" y="13" width="42" height="26" rx="3" fill="#151110"/>
  <rect x="11" y="13" width="42" height="26" rx="3" fill="none" stroke="url(#g)" stroke-width="1" opacity="0.3"/>

  <!-- Line chart -->
  <polyline points="14,34 20,27 26,30 32,20 38,24 44,16 49,19"
            fill="none" stroke="url(#g)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Glow dot at latest point -->
  <circle cx="49" cy="19" r="2" fill="#f5a524" opacity="0.8">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Stand -->
  <rect x="26" y="44" width="12" height="4" rx="1.5" fill="url(#g)" opacity="0.6"/>
  <rect x="22" y="48" width="20" height="3" rx="1.5" fill="url(#g)" opacity="0.4"/>

  <!-- Subtle screen scanline reflection -->
  <rect x="11" y="13" width="42" height="6" rx="3" fill="url(#g2)" opacity="0.15"/>
</svg>
