<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexoDashboard — Acceso</title>
<link rel="stylesheet" href="/theme.css">
<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; align-items: center; justify-content: center; }
  .login-card { width: 320px; padding: 36px 32px; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .brand-badge {
    width: 38px; height: 38px; border-radius: 11px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center; font-size: 18px;
  }
  .brand-title { font-size: 15px; font-weight: 700; color: var(--ink); }
  .brand-sub { font-size: 12px; color: var(--ink-muted); margin: 2px 0 24px; }
  .field-label { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; color: var(--ink-muted); display: block; margin-bottom: 6px; }
  .field-wrap { position: relative; }
  input[type="password"], input[type="text"].pw-input {
    width: 100%; background: var(--surface-raised); border: 1px solid var(--border);
    border-radius: 10px; padding: 11px 40px 11px 13px; color: var(--ink); font-size: 14px;
    font-family: inherit; transition: border-color 0.15s; box-sizing: border-box;
  }
  input[type="password"]:focus, input[type="text"].pw-input:focus { outline: none; border-color: var(--accent); }
  .eye-toggle {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; color: var(--ink-muted);
    padding: 6px; display: flex; align-items: center; border-radius: 6px;
  }
  .eye-toggle:hover { color: var(--ink-secondary); }
  .submit-btn {
    width: 100%; margin-top: 18px; padding: 11px; border: none; border-radius: 10px;
    font-weight: 600; font-size: 13px; letter-spacing: 0.02em; cursor: pointer;
    font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .err { color: var(--status-critical); font-size: 12px; margin-top: 12px; min-height: 14px; text-align: center; }
</style>
</head>
<body>
  <form class="card login-card" id="loginForm">
    <div class="brand">
      <div class="brand-badge">🔗</div>
      <div class="brand-title">NexoDashboard</div>
    </div>
    <p class="brand-sub">Acceso al panel de monitoreo</p>
    <label class="field-label" for="password">Clave de acceso</label>
    <div class="field-wrap">
      <input type="password" id="password" name="password" autofocus required autocomplete="current-password">
      <button type="button" class="eye-toggle" id="toggleEye" tabindex="-1" aria-label="Mostrar contraseña">
        <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      </button>
    </div>
    <button type="submit" class="submit-btn btn-primary" id="submitBtn">
      <span id="btnLabel">Entrar</span>
    </button>
    <div class="err" id="err"></div>
  </form>
  <script src="/login.js" defer></script>
</body>
</html>
