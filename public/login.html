<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Acceso a NexoDashboard">
<title>NexoDashboard — Acceso</title>
<link rel="stylesheet" href="/fonts.css">
<link rel="stylesheet" href="/tailwind.css">
<link rel="stylesheet" href="/theme.css">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body class="antialiased">
  <div class="login-wrap">
    <form class="card login-card" id="loginForm" novalidate>
      <div class="flex items-center gap-3 mb-1">
        <div class="brand-badge" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        </div>
        <span style="font-size:15px;font-weight:800;letter-spacing:-0.01em">NexoDashboard</span>
        <span class="pill ml-auto" style="font-size:10px">acceso seguro</span>
      </div>
      <p class="muted mb-6" style="font-size:12px;line-height:1.6">Centro de comando del servidor. Introduce tu clave para entrar.</p>

      <label class="label block mb-1.5" for="password">Clave de acceso</label>
      <div style="position:relative">
        <input type="password" id="password" name="password" autofocus required autocomplete="current-password" class="field" style="padding-right:2.6rem" placeholder="••••••••">
        <button type="button" class="eye-toggle-btn" id="toggleEye" tabindex="-1" aria-label="Mostrar contraseña">
          <svg id="eyeIcon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </button>
      </div>

      <button type="submit" class="btn-primary w-full mt-5 rounded-xl py-3 inline-flex items-center justify-center gap-2" id="submitBtn" style="font-size:14px;font-weight:700">
        <span id="btnLabel">Entrar</span>
      </button>
      <div class="login-err" id="err" role="status" aria-live="polite"></div>
      <p class="faint text-center mt-4" style="font-size:11px;line-height:1.6">La clave se guarda cifrada en el servidor (PBKDF2). Solo quien la conoce puede entrar.</p>
    </form>
  </div>
  <script src="/login.js" defer></script>
</body>
</html>
